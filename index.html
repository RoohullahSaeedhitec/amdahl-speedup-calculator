<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amdahl's Law Speedup Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Amdahl's Law Speedup Calculator</h1>
    <p class="formula">Speedup = 1 / ((1 - f) + f / s)</p>

    <label for="fraction">Fraction improved (f, between 0 and 1)</label>
    <input type="text" id="fraction" placeholder="e.g. 0.6">

    <label for="speedup">Speedup of that part (s)</label>
    <input type="text" id="speedup" placeholder="e.g. 2">

    <button onclick="calculate()">Calculate</button>

    <p id="result"></p>
  </div>
  <script src="script.js"></script>
</body>
</html>
